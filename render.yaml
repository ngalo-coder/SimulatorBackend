services:
  - type: web
    name: simulator-backend
    env: node
    buildCommand: |
      echo "Starting clean build process..." &&
      rm -rf node_modules package-lock.json &&
      npm cache clean --force &&
      npm install --no-package-lock --no-audit --no-fund
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /